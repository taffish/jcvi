[package]
name = "jcvi"
kind = "tool"
version = "1.6.6"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/jcvi"

[command]
name = "taf-jcvi"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/jcvi:1.6.6-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["comparative-genomics", "genome-assembly", "genome-annotation", "synteny", "bioinformatics-utilities"]
keywords = ["JCVI", "MCscan", "ALLMAPS", "synteny", "comparative genomics", "genome assembly", "genome annotation", "FASTA", "BED", "GFF", "genomics graphics"]
description = "JCVI 1.6.6 Python toolkit for genome assembly, annotation, comparative genomics, file-format manipulation, synteny analysis, and genomics graphics."

[upstream]
name = "JCVI"
type = "github"
repo = "tanghaibao/jcvi"
homepage = "https://github.com/tanghaibao/jcvi"
manual = "https://github.com/tanghaibao/jcvi/wiki"
release_url = "https://github.com/tanghaibao/jcvi/tree/v1.6.6"
downloads = "https://files.pythonhosted.org/packages/f2/a2/030e2c1993a8729f152e2ae7d0ecbfe381c9e8cade9c9f7620d1c7e4481b/jcvi-1.6.6.tar.gz"
version = "1.6.6"
license = "BSD-2-Clause"
citation = "Tang et al. 2024, JCVI: A versatile toolkit for comparative genomics analysis"
doi = "10.1002/imt2.211"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 600
exist = ["jcvi", "python", "bedtools", "convert", "identify", "dot", "tesseract", "Rscript", "embossversion", "needle", "samtools", "bgzip", "tabix", "bash", "grep", "sed", "ldd"]
test = ["jcvi --version 2>&1 | grep -Fx 'jcvi 1.6.6' >/dev/null && jcvi --help 2>&1 | grep -F 'Run jcvi modules' >/dev/null", "jcvi formats.fasta 2>&1 | grep -F 'Remove irregular chars in FASTA seqs' >/dev/null && jcvi formats.bed 2>&1 | grep -F 'Summarize the lengths of the intervals' >/dev/null && jcvi compara.synteny 2>&1 | grep -F 'Get anchor list using single-linkage algorithm' >/dev/null", "/opt/jcvi/share/testdata/jcvi-smoke.sh identity", "/opt/jcvi/share/testdata/jcvi-smoke.sh fasta", "/opt/jcvi/share/testdata/jcvi-smoke.sh bedtools", "/opt/jcvi/share/testdata/jcvi-smoke.sh graphics", "/opt/jcvi/share/testdata/jcvi-smoke.sh helpers"]
